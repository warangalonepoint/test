<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<title>Lab Bill · Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  body{ background:#fafafa; }
  .sheet{ max-width: 650px; margin: 12px auto; background:#fff; padding:16px 18px; box-shadow:0 1px 6px rgba(0,0,0,.08); position:relative }
  .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px }
  h1{ font-size:18px; margin:0 0 2px 0 }
  .muted{ color:#6b7280 }
  .badge{ padding:2px 8px; border-radius:999px; background:#eef2ff; font-size:12px }
  table{ width:100%; border-collapse:collapse; margin-top:10px }
  th,td{ border-bottom:1px dashed #e5e7eb; padding:6px 6px; font-size:13px; vertical-align:top }
  .right{text-align:right}
  .foot{ margin-top:10px; display:flex; justify-content:space-between; align-items:flex-end; gap:10px }
  .sign{ border-top:1px solid #e5e7eb; padding-top:4px; text-align:right; min-width:180px }
  .watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:.06; font-weight:800; font-size:48px; letter-spacing:.15em }
  .toolbar{ display:flex; gap:8px; justify-content:flex-end; margin:10px auto; max-width:650px }
  @media print{
    body{ background:#fff }
    .toolbar{ display:none }
    .sheet{ box-shadow:none; margin:0; max-width:100%; padding:8mm 10mm }
  }
</style>
<script type="module">
import { db, seed } from '../scripts/db.js';
seed();

const $=s=>document.querySelector(s);
window.addEventListener('DOMContentLoaded', async ()=>{
  const id = await getInvoiceId();
  await render(id);
  const auto = new URLSearchParams(location.search).get('auto');
  if(auto==='1') window.print();
});

async function getInvoiceId(){
  // We reuse the same key for consistency with POS
  let id = localStorage.getItem('printInvoiceId');
  if(!id){ id = prompt('Enter lab bill invoice ID:'); }
  if(!id) throw new Error('No invoice id');
  return +id;
}

async function render(invoiceId){
  const inv = await db.invoices.get(invoiceId);
  if(!inv || inv.type!=='lab'){
    $('.sheet').innerHTML='<p>Lab invoice not found or wrong type.</p>'; return;
  }
  const items = await db.invoiceItems.where('invoiceId').equals(invoiceId).toArray();
  const patient = inv.patientId ? await db.patients.get(inv.patientId).catch(()=>null) : null;

  $('#h-title').textContent = 'Lab Bill';
  $('#h-sub').textContent = `#${invoiceId} • ${inv.date}`;
  $('#p-line').innerHTML = `
    ${inv.patientId?`<b>${inv.patientId}</b>`:'<b>Walk-in</b>'}
    ${patient?` • ${patient.name||''}`:''}
  `;
  $('#d-line').textContent = inv.doctor ? `Doctor: ${inv.doctor}` : '';

  const tbody=$('#rows'); tbody.innerHTML='';
  let sub=0;
  items.forEach((it,idx)=>{
    const base=(+it.rate||+it.price||0) * (+it.qty||1);
    sub+=base;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${idx+1}</td>
      <td>
        <div><b>${it.name||''}</b>${it.code?` <span class="muted">(${it.code})</span>`:''}</div>
      </td>
      <td class="right">${(+it.qty||1).toFixed(0)}</td>
      <td class="right">₹${(+it.rate||+it.price||0).toFixed(2)}</td>
      <td class="right">₹${base.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });

  $('#t-sub').textContent = sub.toFixed(2);
  $('#t-total').textContent = sub.toFixed(2); // usually no GST for lab; adjust if needed
}
</script>
</head>
<body>
<div class="toolbar">
  <button class="btn" onclick="window.print()">Print</button>
  <a class="btn ghost" href="./lab-queue.html">Queue</a>
</div>

<div class="sheet">
  <div class="watermark">CLINIC</div>
  <div class="head">
    <div>
      <h1>Clinic Name</h1>
      <div class="muted small">Address line, City · Phone</div>
    </div>
    <div style="text-align:right">
      <div id="h-title" class="badge">Lab Bill</div>
      <div id="h-sub" class="muted small"></div>
    </div>
  </div>

  <div style="margin-top:8px; display:flex; justify-content:space-between; gap:10px">
    <div id="p-line"></div>
    <div id="d-line" class="muted"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th><th>Test</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Amount</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr><td colspan="4" class="right">Subtotal</td><td class="right">₹ <span id="t-sub">0.00</span></td></tr>
      <tr><td colspan="4" class="right"><b>Total</b></td><td class="right"><b>₹ <span id="t-total">0.00</span></b></td></tr>
    </tfoot>
  </table>

  <div class="foot">
    <div class="muted small">Thank you for visiting • Authorized Signatory</div>
    <div class="sign small">Signature</div>
  </div>
</div>
</body>
</html>
