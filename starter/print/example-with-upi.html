<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Print with UPI QR</title>
<link rel="stylesheet" href="/styles/styles.css"/>
<style>
@page { size: A5; margin: 10mm; }
.small{font-size:12px}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { db } from '/scripts/db.js';

async function upiQR(){
  const box=document.getElementById('upi'); if(!box) return;
  const upiId=(await db.settings.get('upiId'))?.value||'';
  if(!upiId) return;
  const uri = `upi://pay?pa=${encodeURIComponent(upiId)}&cu=INR&am=300`;
  if(navigator.onLine){
    const src=`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(uri)}`;
    box.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
      <img width="120" height="120" src="${src}" alt="UPI QR"/>
      <div>Pay via UPI: <b>${upiId}</b></div>
    </div>`;
  }else{
    box.textContent=`UPI: ${upiId}`;
  }
}
window.addEventListener('DOMContentLoaded', upiQR);
</script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h3>Invoice with UPI QR</h3>
    <table class="table">
      <thead><tr><th>Item</th><th>Amt</th></tr></thead>
      <tbody><tr><td>Consultation</td><td>₹300</td></tr></tbody>
    </table>
    <div style="margin-top:8px"><b>Total: ₹300</b></div>
    <div id="upi" style="margin-top:10px"></div>
  </div>
</div>
</body>
</html>
