<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Print with Clinic Header</title>
<link rel="stylesheet" href="/styles/styles.css"/>
<style>
@page { size: A5; margin: 10mm; }
.small{font-size:12px}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { db } from '/scripts/db.js';

// Inject header from settings
async function clinicHeader(){
  const box=document.getElementById('clinicHeader'); if(!box) return;
  const get = async k => (await db.settings.get(k))?.value || '';
  const name=await get('clinicName')||'Clinic';
  const doc=await get('doctorName')||'';
  const addr=await get('address')||'';
  const gst=await get('gstin')||'';
  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div>
        <div style="font-weight:800;font-size:18px">${name}</div>
        <div class="small">${doc}</div>
        <div class="small">${addr}</div>
      </div>
      <div class="small"><b>GSTIN:</b> ${gst||'—'}</div>
    </div>`;
}
window.addEventListener('DOMContentLoaded', clinicHeader);
</script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="clinicHeader" style="margin-bottom:6px"></div>

    <h3>Invoice Example</h3>
    <table class="table">
      <thead><tr><th>Item</th><th>Rate</th><th>Qty</th><th>Amt</th></tr></thead>
      <tbody>
        <tr><td>Consultation</td><td>₹300</td><td>1</td><td>₹300</td></tr>
      </tbody>
    </table>
    <div style="margin-top:8px"><b>Total: ₹300</b></div>
  </div>
</div>
</body>
</html>
