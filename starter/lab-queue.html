<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lab Queue · Clinic PWA</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  .muted{opacity:.7}.small{font-size:12px}
  .table td,.table th{font-size:13px}
  .nowrap{white-space:nowrap}
  .tests{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script type="module">
import { db, seed } from './scripts/db.js';
import { mountNav } from './scripts/ui.js';
import { requireRole } from './scripts/auth.js';

seed(); requireRole(['doctor','supervisor','front']);
const $=s=>document.querySelector(s);

window.addEventListener('DOMContentLoaded', ()=>{ mountNav('lab'); render(); });

async function render(){
  const body=$('#body');
  let rows=[];
  try{
    rows = await db.labQueue.where('status').equals('queued').reverse().sortBy('ts');
  }catch(err){
    body.innerHTML=`<tr><td colspan="7">labQueue store missing in db.js</td></tr>`;
    return;
  }
  if(!rows.length){ body.innerHTML=`<tr><td colspan="7">No queued lab orders</td></tr>`; return; }

  body.innerHTML = (await Promise.all(rows.map(async r=>{
    const p=r.patientId ? await db.patients.get(r.patientId).catch(()=>null):null;
    const name=p?.name||'', phone=p?.phone||'';
    const tests=(r.tests||[]).join(', ');
    return `<tr>
      <td class="nowrap">#${r.id}</td>
      <td class="nowrap">${r.date||''}</td>
      <td class="nowrap">${r.patientId||''}</td>
      <td>${name} <span class="muted">${phone?('· '+phone):''}</span></td>
      <td class="tests" title="${tests}">${tests || '-'}</td>
      <td class="nowrap">${r.doctor||''}</td>
      <td class="nowrap">
        <button class="btn ghost" data-load="${r.id}">Load in Billing</button>
      </td>
    </tr>`;
  }))).join('');

  body.querySelectorAll('[data-load]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=+btn.getAttribute('data-load');
      const o=await db.labQueue.get(id);
      if(!o){ alert('Order missing'); return; }
      // Stash draft for lab-bill.html to pick up
      localStorage.setItem('labBillDraft', JSON.stringify({
        orderId: id,
        patientId: o.patientId || '',
        doctor: o.doctor || '',
        tests: o.tests || [],
        date: o.date || new Date().toISOString().slice(0,10)
      }));
      // (optional) leave status queued; lab-bill.html should mark billed on save
      window.location.href='lab-bill.html';
    });
  });
}
</script>
</head>
<body>
<div id="nav"></div>
<div class="wrap grid">
  <div class="card">
    <div class="row" style="align-items:center;gap:10px">
      <h2>Lab Queue</h2>
      <div style="flex:1"></div>
      <a class="btn ghost" href="./lab-bill.html">Go to Billing</a>
    </div>
  </div>
  <div class="card">
    <table class="table">
      <thead>
        <tr><th>ID</th><th>Date</th><th>PID</th><th>Patient</th><th>Tests</th><th>Doctor</th><th></th></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>
</body></html>
