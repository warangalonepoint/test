<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lab Hub · Clinic PWA</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<link rel="stylesheet" href="./styles/pastels.css?v=4"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { seed } from './scripts/db.js';
import { mountNav } from './scripts/ui.js';
seed();

window.addEventListener('DOMContentLoaded', ()=>{
  mountNav('lab');
  document.getElementById('btnBack')?.addEventListener('click', ()=> 
    history.length>1 ? history.back() : (window.location.href='dashboard.html')
  );
});
</script>
<style>
:root{--brand:#A78BFA;}
.wrap.grid{gap:14px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.tile{border-radius:16px;padding:20px;color:#fff;text-decoration:none;display:block;box-shadow:0 4px 14px rgba(0,0,0,0.1);}
.tile h3{margin:0 0 8px;}
.tile p{font-size:13px;opacity:.9;}
.g-lav{background:linear-gradient(135deg,#C4B5FD,#A78BFA);}
.g-pink{background:linear-gradient(135deg,#F9A8D4,#EC4899);}
.g-amber{background:linear-gradient(135deg,#FCD34D,#F59E0B);}
.footer{margin-top:30px;text-align:center;font-size:12px;color:#64748b;}
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap grid">
  <div class="header-row" style="padding:4px 2px">
    <button id="btnBack" class="btn ghost">← Back</button>
    <div class="sp"></div>
    <a class="btn ghost" href="./dashboard.html">Home</a>
  </div>

  <h2>Lab Hub</h2>
  <div class="tiles">
    <a class="tile g-lav" href="./lab.html">
      <h3>Lab Dashboard</h3>
      <p>Tests · Reports · Analytics</p>
    </a>
    <a class="tile g-pink" href="./lab-orders.html">
      <h3>Lab Orders</h3>
      <p>Pending · Processing · Completed</p>
    </a>
    <a class="tile g-amber" href="./lab-bill.html">
      <h3>Lab Billing</h3>
      <p>Invoices · Payments · GST</p>
    </a>
  </div>

  <div class="footer">
    Powered by <b>Onestop AI</b>. All Rights Reserved © 2025
  </div>
</div>
</body>
</html>
