<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Data Audit · Clinic PWA</title>
<link rel="stylesheet" href="/styles/styles.css"/>
<style>
  .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
  .ok{color:#16a34a}.warn{color:#dc2626}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { requireRole } from '/scripts/auth.js';
import { mountNav } from '/scripts/ui.js';
import { db } from '/scripts/db.js';

requireRole(['doctor','supervisor']);
mountNav('pages');

const fx = n => (Number(n)||0).toFixed(2);

function computeLine({rate=0, qty=0, discount=0, taxRate=0, sgst=0, cgst=0}){
  rate=+rate||0; qty=+qty||0; discount=+discount||0; taxRate=+taxRate||0;
  const taxable = rate * qty * (1 - discount/100);
  const totalTax = +(taxRate/100 * taxable);
  const _sgst = totalTax/2;
  const _cgst = totalTax/2;
  const amount = taxable + totalTax;
  return {taxable, sgst:_sgst, cgst:_cgst, amount};
}

async function recomputeInvoiceTotals(invId){
  const its = await db.invoiceItems.where('invoiceId').equals(invId).toArray();
  const taxable = its.reduce((a,b)=> a + ((+b.rate||0)*(+b.qty||0)*(1-(+b.discount||0)/100)), 0);
  const tax = its.reduce((a,b)=> a + ((+b.sgst||0)+(+b.cgst||0)), 0);
  const grand = its.reduce((a,b)=> a + (+b.amount||0), 0);
  await db.invoices.update(invId, { total: taxable, tax, grand });
}

async function audit(){
  const issues = [];
  const invoices = await db.invoices.toArray();

  for (const inv of invoices) {
    if (!inv.type) {
      issues.push({number: inv.number||inv.id, id: inv.id, issue: 'Missing invoice type'});
    }
    const items = await db.invoiceItems.where('invoiceId').equals(inv.id).toArray();

    let taxable = 0, tax = 0, grand = 0;
    for (const it of items) {
      const line = computeLine(it);
      const seenTax = (+it.sgst||0) + (+it.cgst||0);
      const expTax = line.sgst + line.cgst;
      const amtExp = line.amount;

      taxable += line.taxable;
      tax += seenTax;
      grand += (+it.amount||0);

      if (Math.abs(seenTax - expTax) > 0.05) {
        issues.push({number: inv.number||inv.id, id: inv.id, issue: `Line tax mismatch (${it.name||'item'})`});
      }
      if (Math.abs((+it.amount||0) - amtExp) > 0.05) {
        issues.push({number: inv.number||inv.id, id: inv.id, issue: `Line amount mismatch (${it.name||'item'})`});
      }
    }

    if (Math.abs((inv.total||0) - taxable) > 0.1) {
      issues.push({number: inv.number||inv.id, id: inv.id, issue: 'Invoice total mismatch'});
    }
    if (Math.abs((inv.tax||0) - tax) > 0.1) {
      issues.push({number: inv.number||inv.id, id: inv.id, issue: 'Invoice tax mismatch'});
    }
    if (Math.abs((inv.grand||0) - grand) > 0.1) {
      issues.push({number: inv.number||inv.id, id: inv.id, issue: 'Invoice grand mismatch'});
    }
  }

  renderIssues(issues);
  return issues;
}

function renderIssues(issues){
  const tbody=document.getElementById('tbl');
  const badge=document.getElementById('statusBadge');
  if(!issues.length){
    tbody.innerHTML=`<tr><td colspan="3">✅ No issues found</td></tr>`;
    badge.innerHTML = `<span class="ok">0 issues</span>`;
  }else{
    tbody.innerHTML=issues.map(e=>`
      <tr>
        <td class="mono">${e.number}</td>
        <td>${e.issue}</td>
        <td class="mono">${e.id}</td>
      </tr>`).join('');
    badge.innerHTML = `<span class="warn">${issues.length} issue(s)</span>`;
  }
}

function exportCSV(issues){
  if(!issues.length){ alert('No issues to export'); return; }
  const head = 'Invoice,Issue,ID\n';
  const body = issues.map(e=>[e.number, e.issue, e.id].join(',')).join('\n');
  const csv = head + body + '\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='data-audit.csv'; a.click();
}

async function fixAll(){
  const btn=document.getElementById('fix'); btn.disabled=true; btn.textContent='Fixing…';
  const summary={ invoicesTagged:0, linesFixed:0, invoicesRecalc:0 };

  const invoices = await db.invoices.toArray();
  for (const inv of invoices){
    // 1) Ensure type
    if(!inv.type){
      inv.type='sale';
      await db.invoices.put(inv);
      summary.invoicesTagged++;
    }

    // 2) Normalize & fix each item
    const items = await db.invoiceItems.where('invoiceId').equals(inv.id).toArray();
    let linesChanged=false;
    for (const it of items){
      // defaults
      it.discount = Number(it.discount ?? 0);
      it.taxRate = Number(it.taxRate ?? 0);
      it.rate = Number(it.rate ?? 0);
      it.qty = Number(it.qty ?? 0);
      it.sgst = Number(it.sgst ?? 0);
      it.cgst = Number(it.cgst ?? 0);
      it.mrp = Number(it.mrp ?? 0);
      it.batch ??= '';
      it.expiry ??= '';
      it.hsn ??= '';
      it.pack ??= '';

      const calc = computeLine(it);
      const seenTax = it.sgst + it.cgst;
      const amount = +it.amount || 0;

      const needTaxFix = Math.abs(seenTax - (calc.sgst+calc.cgst)) > 0.05;
      const needAmtFix = Math.abs(amount - calc.amount) > 0.05;

      if (needTaxFix || needAmtFix){
        it.sgst = calc.sgst;
        it.cgst = calc.cgst;
        it.amount = calc.amount;
        await db.invoiceItems.put(it);
        summary.linesFixed++;
        linesChanged = true;
      }
    }

    // 3) Recalc invoice if any item changed or totals mismatch
    const fresh = await db.invoices.get(inv.id);
    const before = {total:+fresh.total||0, tax:+fresh.tax||0, grand:+fresh.grand||0};
    await recomputeInvoiceTotals(inv.id);
    const after = await db.invoices.get(inv.id);
    if (linesChanged || Math.abs(before.total - (after.total||0))>0.05 || Math.abs(before.tax - (after.tax||0))>0.05 || Math.abs(before.grand - (after.grand||0))>0.05){
      summary.invoicesRecalc++;
    }
  }

  // Show summary + rerun audit
  document.getElementById('summary').innerHTML =
    `<div class="small">Tagged invoices: <b>${summary.invoicesTagged}</b> • Lines fixed: <b>${summary.linesFixed}</b> • Recalculated invoices: <b>${summary.invoicesRecalc}</b></div>`;
  const issues = await audit();
  btn.disabled=false; btn.textContent='Fix All';
  if(!issues.length) document.getElementById('statusBadge').innerHTML = `<span class="ok">All clean</span>`;
}

window.addEventListener('DOMContentLoaded', async ()=>{
  // initial audit
  const issues = await audit();
  document.getElementById('export').addEventListener('click', ()=>exportCSV(issues));
  document.getElementById('fix').addEventListener('click', fixAll);
});
</script>
</head>
<body>
<div id="nav"></div>
<div class="wrap grid">
  <div class="card">
    <h2>Data Audit <span id="statusBadge" class="badge"></span></h2>
    <p class="small">Checks invoices & items for: missing <code class="mono">type</code>, wrong SGST/CGST, wrong line <code class="mono">amount</code>, and invoice totals. “Fix All” will auto-repair and recompute.</p>
    <div class="row">
      <button class="btn" id="fix">Fix All</button>
      <button class="btn ghost" id="export">Export Issues CSV</button>
    </div>
    <div id="summary" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <table class="table">
      <thead><tr><th>Invoice</th><th>Issue</th><th>ID</th></tr></thead>
      <tbody id="tbl"></tbody>
    </table>
  </div>
</div>
</body>
</html>
