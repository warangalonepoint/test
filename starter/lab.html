<!doctype html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lab · Create Order</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { seed, db } from './scripts/db.js';
import { requireRole } from './scripts/auth.js';
import { mountNav } from './scripts/ui.js';
import { loadCatalog, searchTests, createLabOrder, printLabBill } from './scripts/lab.js';

seed(); requireRole(['doctor','supervisor','front']);

let selected = [];
let combinedCatalog = [];

// Poster tests (from your photo). Prices remain editable after adding.
const POSTER_TESTS = [
  { code:'CBP',                 name:'CBP',                         price:300 },
  { code:'CRP',                 name:'CRP',                         price:400 },
  { code:'TYPH_IGM_IGG',        name:'Typhoid IgM IgG',             price:300 },
  { code:'CUE',                 name:'CUE (Urine Routine)',         price:150 },
  { code:'RBS',                 name:'RBS (Random Blood Sugar)',    price: 50 },
  { code:'TSB',                 name:'TSB',                         price:300 },
  { code:'DENGUE_IGM_IGG',      name:'Dengue IgM/IgG',              price:300 },
  { code:'MALARIA_PV_PF',       name:'Malaria (for Pv/Pf)',         price:800 },
  { code:'T3_T4_TSH',           name:'T3, T4, TSH',                 price:500 },
  { code:'URINE_CS_AUTO',       name:'Urine C/S Automated',         price:1100 },
  { code:'URINE_CS_CONV',       name:'Urine C/S Conventional',      price:700 },
  { code:'LFT',                 name:'LFT (Liver Function Test)',   price:250 },
  { code:'CREATININE',          name:'Creatinine',                  price:550 },
  { code:'HBA1C',               name:'HbA1c',                       price:550 },
  { code:'LIPID_PROFILE',       name:'Lipid Profile',               price:550 },
  { code:'SERUM_ELECTROLYTES',  name:'Serum Electrolytes',          price:100 },
  { code:'BLOOD_GROUP',         name:'Blood Grouping',              price:100 },
];

window.addEventListener('DOMContentLoaded', async ()=>{
  mountNav('lab');

  const testInput  = document.getElementById('testInput');
  const testList   = document.getElementById('testList');
  const chosen     = document.getElementById('chosen');
  const totalEl    = document.getElementById('total');
  const patientSel = document.getElementById('patientId');

  // Load patients
  const pts = await db.patients.toArray().catch(()=>[]);
  patientSel.innerHTML = pts.map(p=>`<option value="${p.id}" data-ph="${p.phone||''}">${p.name} — ${p.phone||''}</option>`).join('');

  // Load catalog + merge poster tests (de-dupe by code; prefer existing)
  let baseCatalog = [];
  try { baseCatalog = await loadCatalog(); } catch {}
  const map = new Map();
  [...(Array.isArray(baseCatalog)?baseCatalog:[]), ...POSTER_TESTS].forEach(t=>{
    const code = String(t.code||'').trim() || String(t.name||'').trim();
    if(!map.has(code)) map.set(code, { code, name:t.name||t.code, price:+t.price||0 });
  });
  combinedCatalog = Array.from(map.values());

  renderSuggestions('');

  function renderSelected(){
    chosen.innerHTML = selected.length ? selected.map((t,i)=>`
      <tr>
        <td>${t.code}</td>
        <td>${t.name}</td>
        <td style="max-width:140px">
          <input type="number" step="1" min="0" class="input right small"
                 data-price="${i}" value="${(+t.price||0).toFixed(0)}"/>
        </td>
        <td><button data-i="${i}" class="btn muted">Remove</button></td>
      </tr>
    `).join('') : `<tr><td colspan="4" class="muted">No tests selected</td></tr>`;
    recalcTotal();

    // remove + editable price
    setTimeout(()=>{
      document.querySelectorAll('button[data-i]').forEach(btn=>{
        btn.addEventListener('click', ()=>{ selected.splice(+btn.dataset.i,1); renderSelected(); });
      });
      document.querySelectorAll('input[data-price]').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const idx=+inp.dataset.price; selected[idx].price=+inp.value||0; recalcTotal();
        });
      });
    },0);
  }

  function recalcTotal(){
    totalEl.textContent = '₹' + selected.reduce((a,b)=>a+(+b.price||0),0).toFixed(2);
  }

  function renderSuggestions(q){
    const query=(q||'').toLowerCase();
    const found = combinedCatalog.filter(t=>{
      if(!query) return true;
      return (t.name||'').toLowerCase().includes(query) || (t.code||'').toLowerCase().includes(query);
    }).slice(0,30);

    testList.innerHTML = found.map(t=>`
      <div class="card" style="padding:8px;display:flex;justify-content:space-between;align-items:center">
        <div><b>${t.name}</b> <span class="badge">${t.code}</span></div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="badge">₹${(+t.price||0).toFixed(0)}</span>
          <button class="btn" data-code="${t.code}">Add</button>
        </div>
      </div>
    `).join('');

    setTimeout(()=>{
      document.querySelectorAll('button[data-code]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const code=b.dataset.code;
          const t = found.find(x=>x.code===code);
          if(t){ selected.push({ code:t.code, name:t.name, price:+t.price||0 }); renderSelected(); }
        });
      });
    },0);
  }

  testInput.addEventListener('input', ()=>renderSuggestions(testInput.value.trim()));

  document.getElementById('create').addEventListener('click', async ()=>{
    try{
      const pid = patientSel.value;
      if(!pid){ alert('Select patient'); return; }
      const p = pts.find(x=>x.id===pid)||{};
      const doctor = document.getElementById('doctor').value.trim();
      const order = await createLabOrder({
        patientId: pid,
        patientName: p.name||'',
        patientPhone: p.phone||'',
        doctor,
        tests: selected
      });
      alert('Lab order created: '+order.orderNo);
      printLabBill(order.id);
      selected=[]; renderSelected();
    }catch(err){ alert(err?.message||'Failed to create order'); }
  });

  renderSelected();
});
</script>
<style>
.small{font-size:12px}
.right{text-align:right}
</style>
</head>
<body>
<div id="nav"></div>
<div class="wrap grid">
  <div class="card">
    <h2>Create Lab Order</h2>
    <div class="row">
      <label>Patient
        <select id="patientId" class="input"></select>
      </label>
      <label>Doctor
        <input id="doctor" class="input" placeholder="Dr.Charan Theja Reddy"/>
      </label>
    </div>

    <label>Find Test</label>
    <input id="testInput" class="input" placeholder="Search test name or code"/>

    <div id="testList" class="grid" style="margin-top:10px;grid-template-columns:1fr"></div>
  </div>

  <div class="card">
    <h3>Selected Tests</h3>
    <table class="table">
      <thead><tr><th>Code</th><th>Test</th><th>Price</th><th></th></tr></thead>
      <tbody id="chosen"></tbody>
    </table>
    <div style="margin-top:8px"><b>Total: <span id="total">₹0.00</span></b></div>
    <button class="btn" id="create" style="margin-top:10px">Create Order & Print Bill</button>
  </div>
</div>
</body>
</html>
