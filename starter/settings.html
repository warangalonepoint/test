<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Settings · Clinic PWA</title>
<link rel="stylesheet" href="/styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { seed, db } from '/scripts/db.js';
import { requireRole, setPin } from '/scripts/auth.js';
import { mountNav } from '/scripts/ui.js';
seed(); requireRole(['doctor']);
async function get(k){ const r=await db.settings.get(k); return r?.value??''; }
async function set(k,v){ await db.settings.put({key:k,value:v}); }

window.addEventListener('DOMContentLoaded', async ()=>{
  mountNav('settings');

  // PIN forms
  for(const r of ['doctor','supervisor','front']){
    document.getElementById('set-'+r).addEventListener('submit', async e=>{
      e.preventDefault(); const pin=e.target.querySelector('input').value.trim(); if(!pin) return;
      await setPin(r,pin); alert('PIN updated');
    });
  }

  // Clinic form
  const keys=['clinicName','doctorName','address','gstin','upiId'];
  for(const k of keys){ document.getElementById(k).value = await get(k); }
  document.getElementById('saveClinic').addEventListener('click', async ()=>{
    for(const k of keys){ await set(k, document.getElementById(k).value.trim()); }
    alert('Clinic profile saved');
  });
});
</script>
</head><body>
<div id="nav"></div>
<div class="wrap grid">
  <div class="card">
    <h2>Change PINs (Doctor only)</h2>
    <div class="row">
      <form id="set-doctor"><label>Doctor PIN<input class="input" placeholder="new PIN"/></label><button class="btn">Save</button></form>
      <form id="set-supervisor"><label>Supervisor PIN<input class="input" placeholder="new PIN"/></label><button class="btn">Save</button></form>
    </div>
    <div class="row" style="margin-top:10px">
      <form id="set-front"><label>Front Office PIN<input class="input" placeholder="new PIN"/></label><button class="btn">Save</button></form>
    </div>
  </div>

  <div class="card">
    <h2>Clinic Profile (prints use this)</h2>
    <div class="grid" style="gap:8px">
      <label>Clinic Name<input id="clinicName" class="input" placeholder="DHUVI MEDICALS / Charan Child Clinic"/></label>
      <label>Doctor Name<input id="doctorName" class="input" placeholder="Dr. Charan Theja Reddy"/></label>
      <label>Address<textarea id="address" class="input" rows="2" placeholder="Full address"></textarea></label>
      <div class="row">
        <label>GSTIN<input id="gstin" class="input" placeholder="36AIGPV6062N1ZH"/></label>
        <label>UPI ID<input id="upiId" class="input" placeholder="clinic@upi"/></label>
      </div>
      <button class="btn" id="saveClinic">Save Clinic Profile</button>
      <p class="muted">Print pages will auto-show header and optional UPI QR (online only).</p>
    </div>
  </div>
</div>
</body></html>
