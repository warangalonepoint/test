<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pharmacy Queue · Clinic PWA</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  .muted{opacity:.7}.small{font-size:12px}
  .table td,.table th{font-size:13px}
</style>
<script type="module">
import { db, seed } from './scripts/db.js';
import { mountNav } from './scripts/ui.js';
import { requireRole } from './scripts/auth.js';

seed(); requireRole(['doctor','supervisor','front']);
const $=s=>document.querySelector(s);

window.addEventListener('DOMContentLoaded', ()=>{ mountNav('pharmacy'); render(); });

async function render(){
  const body=$('#body');
  let rows=[];
  try{
    rows = await db.rxQueue.where('status').equals('queued').reverse().sortBy('ts');
  }catch(err){
    body.innerHTML=`<tr><td colspan="6">rxQueue store missing in db.js</td></tr>`;
    return;
  }
  if(!rows.length){ body.innerHTML=`<tr><td colspan="6">No queued Rx</td></tr>`; return; }

  body.innerHTML = (await Promise.all(rows.map(async r=>{
    const p=r.patientId ? await db.patients.get(r.patientId).catch(()=>null):null;
    const name=p?.name||'', phone=p?.phone||'';
    return `<tr>
      <td>#${r.id}</td>
      <td>${r.date||''}</td>
      <td>${r.patientId||''}</td>
      <td>${name} <span class="muted">${phone?('· '+phone):''}</span></td>
      <td>${(r.items||[]).length}</td>
      <td><button class="btn ghost" data-load="${r.id}">Load in POS</button></td>
    </tr>`;
  }))).join('');

  body.querySelectorAll('[data-load]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=+btn.getAttribute('data-load');
      const r=await db.rxQueue.get(id);
      if(!r){ alert('Rx missing'); return; }
      // stash to localStorage so pharmacy-sale can pick it up
      localStorage.setItem('pharmacySaleDraft', JSON.stringify({
        patientId:r.patientId, doctor:r.doctor||'', sourceRxId:id,
        items:r.items||[], payment:{method:'cash', paid:0}
      }));
      window.location.href='pharmacy-sales.html';
    });
  });
}
</script>
</head>
<body>
<div id="nav"></div>
<div class="wrap grid">
  <div class="card">
    <div class="row" style="align-items:center;gap:10px">
      <h2>Pharmacy Queue</h2>
      <div style="flex:1"></div>
      <a class="btn ghost" href="./pharmacy-sale.html">Go to POS</a>
    </div>
  </div>
  <div class="card">
    <table class="table">
      <thead><tr><th>ID</th><th>Date</th><th>PID</th><th>Patient</th><th>Items</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>
</body></html>
