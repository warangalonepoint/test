<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Backup & Restore · Clinic PWA</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  .wrap{max-width:900px;margin:0 auto}
  .muted{opacity:.7}
  .row-gap{gap:10px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media (max-width:900px){ .kpis{grid-template-columns:1fr } }
  .kpi{background:#fff;border:1px solid #eef;border-radius:12px;padding:12px}
  .kpi h4{margin:0 0 4px}
  .table td,.table th{font-size:13px}
  .pill{padding:2px 8px;border-radius:999px;background:#eef2ff}
  .danger{background:#fee2e2;color:#991b1b}
</style>
<script type="module">
import { db, seed } from './scripts/db.js';
import { requireRole } from './scripts/auth.js';
import { mountNav } from './scripts/ui.js';

seed(); requireRole(['doctor','supervisor']); // restore is privileged
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

const STORES = [
  'patients','bookings','OPD','rxQueue','labQueue',
  'inventory','pharmacyItems', // legacy names tolerated
  'invoices','invoiceItems','invoiceAudit'
].filter((v,i,a)=>a.indexOf(v)===i); // uniq

window.addEventListener('DOMContentLoaded', async ()=>{
  mountNav('backup');
  await refreshCounts();
  bindActions();
});

async function refreshCounts(){
  const body = $('#countsBody'); body.innerHTML='';
  for(const name of STORES){
    const table = db[name]; if(!table) continue;
    const c = await table.count().catch(()=>0);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}</td><td>${c}</td>`;
    body.appendChild(tr);
  }
}

function bindActions(){
  $('#doBackup').addEventListener('click', doBackup);
  $('#file').addEventListener('change', previewRestore);
  $('#apply').addEventListener('click', applyRestore);
  $('#wipe').addEventListener('click', wipeDanger);
}

/* ---------- BACKUP ---------- */
async function doBackup(){
  const snapshot = { createdAt: new Date().toISOString(), version:'v1', tables:{} };
  for(const name of STORES){
    const table = db[name]; if(!table) continue;
    snapshot.tables[name] = await table.toArray().catch(()=>[]);
  }
  const blob = new Blob([JSON.stringify(snapshot,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `clinic-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- RESTORE (PREVIEW) ---------- */
let restorePayload = null;
async function previewRestore(){
  const file = this.files?.[0];
  if(!file){ $('#preview').innerHTML=''; restorePayload=null; return; }
  const text = await file.text();
  try{
    const json = JSON.parse(text);
    if(!json?.tables || typeof json.tables!=='object') throw new Error('Invalid backup file');
    restorePayload = json;
  }catch(e){
    alert('Bad JSON: '+e.message);
    restorePayload = null;
    return;
  }
  // Build preview deltas (new vs existing by primary keys)
  const lines=[];
  for(const name of STORES){
    const incoming = restorePayload.tables[name]||[];
    const table = db[name]; if(!table){ lines.push(row(name,0,0,0,'(table missing in app)')); continue; }
    const existing = await table.toArray().catch(()=>[]);
    // get primary key for this store
    const pk = table.schema.primKey?.keyPath || 'id';
    const exIndex = new Map(existing.map(x=>[String(x[pk]), x]));
    let create=0, update=0, skip=0;
    incoming.forEach(rec=>{
      const key = String(rec[pk]);
      if(!key || key==='undefined'){ skip++; return; }
      if(exIndex.has(key)){ update++; } else { create++; }
    });
    lines.push(row(name, incoming.length, create, update, `PK: ${pk} · existing ${existing.length}`));
  }
  $('#preview').innerHTML = `
    <table class="table">
      <thead><tr><th>Table</th><th>Incoming</th><th>Create</th><th>Update</th><th>Notes</th></tr></thead>
      <tbody>${lines.join('')}</tbody>
    </table>
    <div class="muted small">Strategy: <b>merge-safe</b> — we upsert by PK (create if missing, update if exists). No deletes.</div>
  `;
  function row(n,tot,cre,upd,notes){ return `<tr><td>${n}</td><td>${tot}</td><td>${cre}</td><td>${upd}</td><td class="muted small">${notes}</td></tr>`; }
}

/* ---------- RESTORE (APPLY) ---------- */
async function applyRestore(){
  if(!restorePayload){ alert('Load a backup file first.'); return; }
  if(!confirm('Apply merge-safe restore now? (Upsert only, no deletes)')) return;

  // transaction across all known tables to keep it atomic
  await db.transaction('rw', ...STORES.map(n=>db[n]).filter(Boolean), async ()=>{
    for(const name of STORES){
      const table = db[name]; if(!table) continue;
      const incoming = restorePayload.tables[name]||[];
      const pk = table.schema.primKey?.keyPath || 'id';
      for(const rec of incoming){
        const key = rec[pk];
        if(key==null){ continue; }
        const exists = await table.get(key);
        if(exists){ await table.put({...exists, ...rec}); } else { await table.add(rec); }
      }
    }
  });

  alert('Restore applied (merge-safe).');
  await refreshCounts();
}

/* ---------- DANGER: WIPE (DEV ONLY) ---------- */
async function wipeDanger(){
  if(!confirm('⚠️ DANGER: This will delete ALL data in this browser. Continue?')) return;
  await db.transaction('rw', ...STORES.map(n=>db[n]).filter(Boolean), async ()=>{
    for(const name of STORES){ const t = db[name]; if(t) await t.clear(); }
  });
  alert('All tables cleared.');
  await refreshCounts();
}
</script>
</head>
<body>
<div id="nav"></div>

<div class="wrap grid">

  <div class="card">
    <div class="row row-gap" style="align-items:center">
      <h2>Backup & Restore</h2>
      <span class="pill">Local-first • IndexedDB (Dexie)</span>
      <div style="flex:1"></div>
      <button id="doBackup" class="btn">Export Backup (.json)</button>
    </div>
    <div class="muted small">Tip: Keep multiple dated backups. Restore is merge-safe (no deletes).</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">Current Data Snapshot</h3>
    <table class="table">
      <thead><tr><th>Table</th><th>Count</th></tr></thead>
      <tbody id="countsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">Restore (Preview & Apply)</h3>
    <div class="row row-gap" style="align-items:flex-end;flex-wrap:wrap">
      <label>Choose Backup File
        <input id="file" type="file" class="input" accept="application/json"/>
      </label>
      <button id="apply" class="btn" type="button">Apply Merge-Safe Restore</button>
      <button id="wipe" class="btn danger ghost" type="button">Wipe All (Dev)</button>
    </div>
    <div id="preview" style="margin-top:10px"></div>
  </div>

</div>
</body>
</html>
