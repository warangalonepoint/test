<!-- /pharmacy-purchases.html -->
<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pharmacy Purchases · Clinic PWA</title>
<link rel="stylesheet" href="/styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { seed } from '/scripts/db.js';
import { requireRole } from '/scripts/auth.js';
import { mountNav } from '/scripts/ui.js';
import { createInvoice, addInvoiceItem, loadInvoice, printInvoice } from '/scripts/rx.js';
seed(); requireRole(['doctor','supervisor']);
let current;
window.addEventListener('DOMContentLoaded', async ()=>{
  mountNav('pharmacy');
  current = await createInvoice({type:'purchase'});
  document.getElementById('invNo').textContent=current.number;

  const f=document.getElementById('f');
  const list=document.getElementById('list');
  const totals=document.getElementById('totals');

  async function refresh(){
    const {inv, items}=await loadInvoice(current.id);
    list.innerHTML=items.map(i=>`
      <tr>
        <td>${i.sku}</td><td>${i.name}</td><td>${i.pack||''}</td><td>${i.batch||''}</td><td>${i.expiry||''}</td>
        <td>${i.hsn||''}</td><td>${i.qty}</td><td>${(+i.mrp).toFixed(2)}</td><td>${(+i.rate).toFixed(2)}</td>
        <td>${i.discount||0}%</td><td>${i.taxRate||0}%</td><td>${(+i.amount).toFixed(2)}</td>
      </tr>`).join('');
    totals.innerHTML=`<b>Taxable:</b> ₹${(+inv.total).toFixed(2)} • <b>Tax:</b> ₹${(+inv.tax).toFixed(2)} • <b>Grand:</b> ₹${(+inv.grand).toFixed(2)}`;
  }

  f.addEventListener('submit', async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f).entries());
    try{
      await addInvoiceItem(current.id, {
        sku:d.sku, name:d.name, pack:d.pack, batch:d.batch, expiry:d.expiry,
        qty:+d.qty, mrp:+d.mrp, rate:+d.rate, taxRate:+d.taxRate, discount:+d.discount, hsn:d.hsn
      });
      f.reset(); await refresh();
    }catch(err){ alert(err.message); }
  });

  document.getElementById('print').addEventListener('click', ()=>printInvoice('purchase', current.id));
  await refresh();
});
</script>
</head>
<body>
<div id="nav"></div>
<div class="wrap grid">
  <div class="card">
    <h2>Purchases <span class="badge" id="invNo"></span></h2>
    <form id="f" class="grid" style="gap:8px">
      <div class="row">
        <label>SKU* <input name="sku" class="input" required/></label>
        <label>Product* <input name="name" class="input" required/></label>
      </div>
      <div class="row">
        <label>Pack* <input name="pack" class="input" required/></label>
        <label>HSN* <input name="hsn" class="input" required/></label>
      </div>
      <div class="row">
        <label>Batch* <input name="batch" class="input" required/></label>
        <label>Expiry* <input name="expiry" class="input" placeholder="YYYY-MM" required/></label>
      </div>
      <div class="row">
        <label>Qty* <input name="qty" class="input" type="number" step="1" required/></label>
        <label>Rate* <input name="rate" class="input" type="number" step="0.01" required/></label>
      </div>
      <div class="row">
        <label>MRP* <input name="mrp" class="input" type="number" step="0.01" required/></label>
        <label>GST %* <input name="taxRate" class="input" type="number" step="1" value="12" required/></label>
      </div>
      <div class="row">
        <label>Discount % <input name="discount" class="input" type="number" step="0.01" value="0"/></label>
        <div></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn">Add Line</button>
        <button class="btn ghost" type="button" id="print">Print</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3>Lines</h3>
    <table class="table">
      <thead><tr>
        <th>SKU</th><th>Name</th><th>Pack</th><th>Batch</th><th>Exp</th><th>HSN</th>
        <th>Qty</th><th>MRP</th><th>Rate</th><th>Disc%</th><th>GST%</th><th>Amt</th>
      </tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div id="totals" style="margin-top:8px"></div>
  </div>
</div>
</body>
</html>
