<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bookings · Clinic PWA</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  .wrap{max-width:1100px;margin:0 auto}
  .row-gap{gap:10px}
  .muted{opacity:.7}
  .right{text-align:right}
  .grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
  @media (max-width:1000px){ .grid2{grid-template-columns:1fr} }
  .suggest{position:relative}
  .dropdown{position:absolute;left:0;right:0;z-index:20;max-height:220px;overflow:auto}
  .dropdown .item{padding:6px;border-bottom:1px dashed #e5e7eb;cursor:pointer;background:#fff}
  .pill{padding:2px 8px;border-radius:999px;background:#eef2ff}
  .badge{padding:2px 8px;border-radius:8px;background:#f3f4f6;font-size:12px}
  .table td,.table th{font-size:13px}
</style>
<script type="module">
import { db, seed } from './scripts/db.js';
import { requireRole } from './scripts/auth.js';
import { mountNav } from './scripts/ui.js';
import { fmt } from './scripts/utils.js';

seed(); requireRole(['doctor','supervisor','front']);
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

window.addEventListener('DOMContentLoaded', async ()=>{
  mountNav('bookings');
  bindPatientSearch();
  bindDOB();
  bindVitalsMirror();
  bindForm();
  await renderToday();

  // Event delegation: ensure draft is saved before navigating
  document.getElementById('todayTable').addEventListener('click', (e)=>{
    const a = e.target.closest('a.opdLink');
    if(!a) return;
    e.preventDefault();
    try{
      const data = JSON.parse(decodeURIComponent(a.getAttribute('data-draft')));
      localStorage.setItem('opdDraft', JSON.stringify(data));
    }catch{}
    window.location.href = a.getAttribute('data-href') || 'opd.html';
  });
});

/* -------- Patient Search (PID / Name / Phone) -------- */
function bindPatientSearch(){
  const box = $('#patientSearch'), panel=$('#patientSuggest');
  async function search(){
    const q=(box.value||'').trim().toLowerCase();
    if(!q){ panel.innerHTML=''; return; }
    const pts = await db.patients.toArray().catch(()=>[]);
    const rows = pts.filter(p=>{
      return (p.id||'').toLowerCase().includes(q)
          || (p.name||'').toLowerCase().includes(q)
          || (p.phone||'').toLowerCase().includes(q);
    }).slice(0,8);
    if(!rows.length){ panel.innerHTML=''; return; }
    panel.innerHTML = `<div class="card dropdown small">
      ${rows.map(p=>`<div class="item" data-pid="${p.id}">
        <b>${p.id}</b> — ${p.name||''} <span class="muted">· ${p.phone||''}</span>
      </div>`).join('')}
    </div>`;
    panel.querySelectorAll('.item').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const pid=el.getAttribute('data-pid');
        const p=await db.patients.get(pid);
        if(!p) return;
        $('#patientId').value = p.id;
        $('#name').value = p.name||'';
        $('#phone').value = p.phone||'';
        $('#dob').value = (p.dob||'').slice(0,10);
        computeAge();
        $('#patientInfo').innerHTML = `<span class="pill">Selected</span> ${p.name||''} · ${p.phone||''}`;
        box.value=''; panel.innerHTML='';
      });
    });
  }
  box.addEventListener('input',search);
  box.addEventListener('focus',search);
  document.addEventListener('click', (e)=>{ if(!panel.contains(e.target) && e.target!==box) panel.innerHTML=''; });
  $('#clearSel').addEventListener('click', ()=>{
    $('#patientId').value=''; $('#patientInfo').innerHTML='';
    $('#name').value=''; $('#phone').value=''; $('#dob').value=''; $('#ageLabel').textContent='—'; $('#ageMonths').value='';
  });
}

/* -------- DOB → Age (years months) -------- */
function bindDOB(){ $('#dob').addEventListener('change', computeAge); }
function computeAge(){
  const dobStr = $('#dob').value;
  if(!dobStr){ $('#ageLabel').textContent='—'; $('#ageMonths').value=''; return; }
  const birth = new Date(dobStr+'T00:00:00');
  const now = new Date();
  let y = now.getFullYear()-birth.getFullYear();
  let m = now.getMonth()-birth.getMonth();
  if(now.getDate() < birth.getDate()) m--;
  if(m<0){ y--; m+=12; }
  $('#ageMonths').value = (y*12 + m);
  $('#ageLabel').textContent = `${y}y ${m}m`;
}

/* -------- keep vitals mirrored into OPD draft preview line -------- */
function bindVitalsMirror(){
  ['height','weight','reason'].forEach(id=>{
    $('#'+id).addEventListener('input', ()=>{
      $('#previewVitals').textContent =
        `Ht ${$('#height').value||'-'} cm · Wt ${$('#weight').value||'-'} kg · ${$('#reason').value||''}`;
    });
  });
}

/* -------- Token helpers -------- */
function tokenPrefix(channel){ return channel==='online' ? '#O' : channel==='whatsapp' ? '#W' : '#'; }
async function nextToken(date, channel){
  const pref = tokenPrefix(channel);
  const list = await db.bookings.where('date').equals(date).toArray().catch(()=>[]);
  const nums = list.filter(b=>(b.token||'').startsWith(pref))
                   .map(b=> parseInt(String(b.token||'').replace(/[^\d]/g,''),10) || 0);
  const max = nums.length ? Math.max(...nums) : 0;
  return `${pref}${String(max+1).padStart(2,'0')}`;
}

/* -------- PID helper -------- */
async function ensurePatient({patientId, name, phone, dob}){
  if(patientId){
    const hit = await db.patients.get(patientId);
    if(hit){
      const patch={};
      if(name && !hit.name) patch.name = name;
      if(phone && !hit.phone) patch.phone = phone;
      if(dob && !hit.dob) patch.dob = dob;
      if(Object.keys(patch).length) await db.patients.update(hit.id, patch);
      return hit.id;
    }
  }
  if(phone){
    const all = await db.patients.toArray().catch(()=>[]);
    const same = all.find(p=>String(p.phone||'')===String(phone));
    if(same) return same.id;
  }
  const pid = 'P' + Date.now().toString().slice(-6);
  await db.patients.add({ id: pid, name: name||'Unknown', phone: phone||'', dob: dob||null, createdAt: new Date().toISOString() });
  return pid;
}

/* -------- Submit -------- */
function bindForm(){
  $('#bookingForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const role=localStorage.getItem('sessionRole');
    if(!role || !['doctor','supervisor','front'].includes(role)){ alert('Not authorized'); return; }

    const date = fmt.date();
    const channel = $('#channel').value;
    const patientIdRaw = ($('#patientId').value||'').trim();
    const name = ($('#name').value||'').trim();
    const phone = ($('#phone').value||'').trim();
    const dob = $('#dob').value ? new Date($('#dob').value+'T00:00:00').toISOString().slice(0,10) : null;
    computeAge();
    const ageMonths = +($('#ageMonths').value||0);
    const heightCm = +($('#height').value||0);
    const weightKg = +($('#weight').value||0);
    const reason = ($('#reason').value||'').trim();

    const pid = await ensurePatient({patientId: patientIdRaw, name, phone, dob});
    const token = await nextToken(date, channel);
    const ts = Date.now();

    await db.bookings.add({
      date, ts, channel, token,
      patientId: pid, name, phone, dob, ageMonths,
      heightCm, weightKg, reason,
      status: 'pending'
    });

    localStorage.setItem('opdDraft', JSON.stringify({
      patientId: pid, ageMonths, heightCm, weightKg, complaints: reason || ''
    }));

    alert(`Booked ${pid} · Token ${token}`);
    (e.target).reset();
    $('#patientId').value=''; $('#patientInfo').innerHTML=''; $('#ageLabel').textContent='—'; $('#ageMonths').value='';
    await renderToday();

    if(confirm('Open OPD now?')) window.location.href='opd.html';
  });
}

/* -------- Today’s list -------- */
async function renderToday(){
  const today = fmt.date();
  const list = await db.bookings.where('date').equals(today).toArray().catch(()=>[]);
  list.sort((a,b)=> (a.ts||0)-(b.ts||0));

  const body = $('#todayBody');
  if(!list.length){ body.innerHTML = `<tr><td colspan="8">No bookings yet.</td></tr>`; return; }

  body.innerHTML = (await Promise.all(list.map(async (b,i)=>{
    let name=b.name||'', phone=b.phone||'';
    if(b.patientId){
      const p=await db.patients.get(b.patientId).catch(()=>null);
      if(p){ name=name||p.name||''; phone=phone||p.phone||''; }
    }
    const ageTxt = (typeof b.ageMonths==='number' && b.ageMonths>=0)
      ? `${Math.floor(b.ageMonths/12)}y ${b.ageMonths%12}m`
      : '—';
    const json = encodeURIComponent(JSON.stringify({
      patientId:b.patientId||'',
      ageMonths:b.ageMonths??null,
      heightCm:b.heightCm??null,
      weightKg:b.weightKg??null,
      complaints:b.reason||''
    }));
    return `
      <tr>
        <td>${i+1}</td>
        <td><b>${b.token}</b> <span class="badge">${b.channel}</span></td>
        <td>${b.patientId || '-'}</td>
        <td>${name||'-'} <span class="muted">${phone?('· '+phone):''}</span></td>
        <td>${ageTxt}</td>
        <td>${(b.heightCm||'-')} / ${(b.weightKg||'-')}</td>
        <td>${b.reason||'-'}</td>
        <td class="right">
          <a class="btn ghost opdLink" data-href="opd.html" data-draft="${json}" href="#">OPD</a>
          <a class="btn ghost" href="patients-history.html?pid=${encodeURIComponent(b.patientId||'')}">History</a>
        </td>
      </tr>
    `;
  }))).join('');
}
</script>
</head>
<body>
<div id="nav"></div>

<div class="wrap grid">
  <div class="card">
    <div class="row" style="align-items:center;gap:10px">
      <h2>Bookings</h2>
      <span class="pill">Local-first</span>
      <div style="flex:1"></div>
      <a class="btn ghost" href="patients.html">Patients</a>
      <a class="btn ghost" href="opd.html">OPD</a>
      <a class="btn ghost" href="patients-history.html">History</a>
    </div>
  </div>

  <div class="grid2">
    <!-- Create -->
    <div class="card">
      <h3 style="margin:0 0 8px">New Booking</h3>
      <form id="bookingForm" class="grid" style="gap:10px">
        <div class="row row-gap" style="flex-wrap:wrap;align-items:flex-end">
          <label>Channel
            <select id="channel" class="input">
              <option value="walkin">Walk-in</option>
              <option value="online">Online</option>
              <option value="whatsapp">WhatsApp</option>
            </select>
          </label>
          <div class="suggest" style="flex:1 1 280px">
            <label>Search Patient (PID / Name / Phone)
              <input id="patientSearch" class="input" placeholder="Type to search…"/>
            </label>
            <div id="patientSuggest"></div>
          </div>
          <label>Patient ID
            <input id="patientId" class="input" placeholder="auto/new if blank"/>
          </label>
          <button id="clearSel" type="button" class="btn ghost">Clear</button>
        </div>

        <div class="row row-gap" style="flex-wrap:wrap">
          <label>Name
            <input id="name" class="input" placeholder="Full name"/>
          </label>
          <label>Phone
            <input id="phone" class="input" inputmode="tel" placeholder="10-digit"/>
          </label>
        </div>

        <div class="row row-gap" style="flex-wrap:wrap;align-items:flex-end">
          <label>Date of Birth
            <input id="dob" type="date" class="input"/>
          </label>
          <label>Age
            <input id="ageMonths" type="number" class="input" readonly />
            <div class="small muted">= <span id="ageLabel">—</span></div>
          </label>
          <label>Height (cm)
            <input id="height" type="number" step="0.1" class="input" placeholder="e.g. 110"/>
          </label>
          <label>Weight (kg)
            <input id="weight" type="number" step="0.1" class="input" placeholder="e.g. 18.5"/>
          </label>
        </div>

        <label>Reason / Complaint
          <input id="reason" class="input" placeholder="Fever, cough, vaccination, follow-up…"/>
        </label>
        <div id="previewVitals" class="small muted"></div>

        <div class="row row-gap" style="justify-content:flex-end">
          <button class="btn" type="submit">Book</button>
        </div>
        <div id="patientInfo" class="small muted"></div>
      </form>
    </div>

    <!-- Today’s list -->
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h3 style="margin:0">Today’s Bookings</h3>
        <div class="muted small">Tokens: walk-in <b>#</b>, online <b>#O</b>, WhatsApp <b>#W</b></div>
      </div>
      <table class="table" id="todayTable">
        <thead>
          <tr>
            <th>#</th><th>Token</th><th>PID</th><th>Patient</th><th>Age</th><th>Ht/Wt</th><th>Reason</th><th></th>
          </tr>
        </thead>
        <tbody id="todayBody"></tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
