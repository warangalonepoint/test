<!doctype html><html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Inventory Barcodes · Clinic PWA</title>
<link rel="stylesheet" href="./styles/styles.css"/>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<style>
  .small{font-size:12px}.muted{opacity:.7}.row-gap{gap:10px}
  .right{text-align:right}.table td input, .table td select{width:100%}
  .pill{padding:2px 8px;border-radius:999px;background:#eef2ff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .narrow{max-width:860px;margin-inline:auto}
</style>
<script type="module">
import { db, seed } from './scripts/db.js';
import { requireRole } from './scripts/auth.js';
import { mountNav } from './scripts/ui.js';
import { BarcodeCache } from './scripts/barcodeCache.js';

seed(); requireRole(['doctor','supervisor','front']);
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

let rows = [];
let q = '';
let focusId = null; // currently selected inventory row id for scan-assign

window.addEventListener('DOMContentLoaded', async ()=>{
  mountNav('pharmacy');
  await BarcodeCache.ensureFresh(db);
  bindUI();
  await load();
  render();
});

function bindUI(){
  $('#search').addEventListener('input', ()=>{ q=$('#search').value.trim().toLowerCase(); render(); });
  $('#rebuildCache').addEventListener('click', async ()=>{
    const n = await BarcodeCache.rebuild(db);
    alert(`Barcode cache rebuilt (${n} items).`);
  });
  $('#clearCache').addEventListener('click', ()=>{ BarcodeCache.clear(); alert('Barcode cache cleared.'); });

  // Fast scan to assign barcode to selected row
  $('#scanAssign').addEventListener('keydown', async (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const code = $('#scanAssign').value.trim();
      if(!code){ return; }
      if(!focusId){ alert('Select a row first (click any barcode cell).'); return; }
      await db.inventory.update(focusId, { barcode: code });
      // reflect change in memory
      const idx = rows.findIndex(r=>r.id===focusId);
      if(idx>=0) rows[idx].barcode = code;
      $('#scanAssign').value='';
      await BarcodeCache.rebuild(db);
      render();
    }
  });
}

async function load(){
  rows = await db.inventory.toArray().catch(()=>[]);
  rows.sort((a,b)=> (a.name||'').localeCompare(b.name||'') || String(a.batch||'').localeCompare(b.batch||''));
}

function filtered(){
  if(!q) return rows;
  return rows.filter(r=>{
    return (r.name||'').toLowerCase().includes(q)
        || (r.batch||'').toLowerCase().includes(q)
        || (String(r.barcode||'')).toLowerCase().includes(q);
  });
}

function render(){
  const list = filtered();
  const body = $('#tableBody');
  if(!list.length){ body.innerHTML = `<tr><td colspan="7">No inventory</td></tr>`; return; }

  body.innerHTML = list.map(r=>`
    <tr data-id="${r.id}">
      <td>${r.id}</td>
      <td>${r.name||''}</td>
      <td>${r.batch||''}</td>
      <td>${String(r.expiry||'').slice(0,10)}</td>
      <td class="right">${r.qty??0}</td>
      <td class="right">₹${(+r.rate||0).toFixed(2)}</td>
      <td>
        <input class="input" data-field="barcode" value="${r.barcode||''}" placeholder="Scan or type…"/>
        <div class="small muted" style="margin-top:2px">${r.barcode?'<span class="pill">saved</span>':'—'}</div>
      </td>
    </tr>
  `).join('');

  // Wire inline edit + row focus
  $$('#tableBody tr').forEach(tr=>{
    const id = +tr.getAttribute('data-id');
    tr.querySelector('[data-field="barcode"]').addEventListener('change', async (e)=>{
      const code = e.target.value.trim();
      await db.inventory.update(id,{ barcode: code });
      const idx = rows.findIndex(r=>r.id===id);
      if(idx>=0) rows[idx].barcode = code;
      await BarcodeCache.rebuild(db);
      render();
    });
    // Clicking barcode cell selects row for scan-assign box
    tr.querySelector('[data-field="barcode"]').addEventListener('focus', ()=>{
      focusId = id;
      $('#currentRow').textContent = `Row #${id}`;
    });
    tr.addEventListener('click', ()=>{
      focusId = id;
      $('#currentRow').textContent = `Row #${id}`;
      tr.querySelector('[data-field="barcode"]').focus();
    });
  });
}
</script>
</head>
<body>
<div id="nav"></div>

<div class="wrap grid narrow">
  <div class="card">
    <div class="toolbar">
      <h2>Inventory Barcodes</h2>
      <input id="search" class="input" placeholder="Search name / batch / barcode"/>
      <button id="rebuildCache" class="btn ghost" type="button">Rebuild Barcode Cache</button>
      <button id="clearCache" class="btn danger ghost" type="button">Clear Cache</button>
    </div>
    <div class="small muted">Tip: Click a barcode cell to select a row, then scan below to assign.</div>
  </div>

  <div class="card">
    <div class="row row-gap" style="align-items:flex-end;flex-wrap:wrap">
      <label style="flex:1 1 280px">Scan Assign to Selected Row
        <input id="scanAssign" class="input" placeholder="Focus a row, then scan and press Enter"/>
      </label>
      <div id="currentRow" class="small muted">—</div>
    </div>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Rate</th><th>Barcode</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>
</body>
</html>
