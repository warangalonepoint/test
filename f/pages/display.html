<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Token Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         height:100vh;background:#f8fbff;font-family:system-ui,sans-serif;color:#0f172a}
    .now{font-size:8vw;font-weight:900;margin:0;color:#0f766e}
    .next{font-size:4vw;margin:0;color:#334155}
    .muted{color:#94a3b8;font-size:1.5vw}
    .tag{font-size:2vw;margin-top:1vw;padding:0.5vw 1.2vw;border-radius:1vw;border:2px solid #e2e8f0;
         display:inline-block}
    .walkin{background:#ecfdf5;border-color:#bbf7d0}
    .online{background:#eff6ff;border-color:#bfdbfe}
    .whatsapp{background:#fff7ed;border-color:#fed7aa}
  </style>
</head>
<body>
  <h1 class="muted">Now Serving</h1>
  <div id="now" class="now">—</div>
  <div id="nowTag" class="tag">—</div>

  <h2 class="muted" style="margin-top:3vw">Next in Queue</h2>
  <div id="next" class="next">—</div>
  <div id="nextTag" class="tag">—</div>

  <audio id="ding" src="../assets/ding.mp3" preload="auto"></audio>

<script type="module">
  import { tokensDB } from '../scripts/db.js';

  const $=s=>document.querySelector(s);
  const todayISO=()=>new Date().toISOString().slice(0,10);

  function tag(mode){
    if(mode==='WALKIN') return '<span class="tag walkin">Walk-in</span>';
    if(mode==='ONLINE') return '<span class="tag online">Online</span>';
    if(mode==='WHATSAPP') return '<span class="tag whatsapp">WhatsApp</span>';
    return '<span class="tag">'+mode+'</span>';
  }

  let lastNow='';
  async function refresh(){
    const r=await tokensDB.find({selector:{Type:'Token',Date:todayISO()},limit:1000}).catch(()=>({docs:[]}));
    const docs=(r.docs||[]).sort((a,b)=>(a.CreatedAt||'').localeCompare(b.CreatedAt||''));

    // Now Serving = first with Status==="InProgress"
    const now=docs.find(d=>d.Status==='InProgress');
    // Next = first Pending/Waiting
    const next=docs.find(d=>d.Status==='Waiting');

    if(now){
      $('#now').textContent=now.Token;
      $('#nowTag').innerHTML=tag(now.Mode);
      if(lastNow!==now._id){ $('#ding').play().catch(()=>{}); lastNow=now._id; }
    }else{
      $('#now').textContent='—'; $('#nowTag').textContent='';
    }

    if(next){
      $('#next').textContent=next.Token;
      $('#nextTag').innerHTML=tag(next.Mode);
    }else{
      $('#next').textContent='—'; $('#nextTag').textContent='';
    }
  }

  // Live changes
  try{ tokensDB.changes({since:'now',live:true}).on('change',refresh);}catch(e){}
  refresh();
</script>
</body>
</html>
