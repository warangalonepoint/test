<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Tokens / Queue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{--line:#e5e7eb;--ink:#0f172a;--muted:#64748b}
    body{margin:0;padding:14px;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:#fff}
    .wrap{max-width:1100px;margin:0 auto}
    .card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;margin-bottom:12px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .input,select,button{padding:9px 12px;border:1px solid #ddd;border-radius:10px;background:#fff;font:inherit}
    button{cursor:pointer}
    .btn{background:#eefdf4;border-color:#c5f6d6}
    .btn-warn{background:#fff7ed;border-color:#ffedd5}
    .btn-danger{background:#fff5f5;border-color:#ffdada;color:#b00020}
    .btn-wa{background:#e8fff1;border-color:#c6f6d5}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top}
    th{text-align:left;background:#fafafa}
    .mini{font-size:12px;color:var(--muted)}
    .now{font-size:56px;font-weight:900;letter-spacing:1px}
    .nowWrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .badge{padding:2px 8px;border-radius:999px;border:1px solid #e5e7eb;background:#f8fafc;font-size:12px}
    .err{color:#b91c1c}
  </style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Tokens / Queue</h2>
      <div class="row">
        <input id="dPick" class="input" type="date"/>
        <button id="refresh" class="input">Refresh</button>
      </div>
    </div>
    <div class="mini">First-come-first-served. Prefixes: Walk-in = <b>01</b>, Online = <b>O01</b>, WhatsApp = <b>W01</b>.</div>
    <div id="msg" class="mini" style="margin-top:6px;display:none"></div>
  </div>

  <div class="card">
    <div class="nowWrap">
      <div>
        <div class="mini">Now serving</div>
        <div id="nowToken" class="now">—</div>
      </div>
      <div class="row">
        <button id="callNext" class="btn">🔊 Call Next</button>
        <button id="recall" class="input">🔁 Recall</button>
        <button id="markDone" class="btn">✅ Complete</button>
        <button id="markSkip" class="btn-warn">⏭ Skip</button>
        <button id="clearNow" class="btn-danger">✕ Clear</button>
      </div>
    </div>
    <div class="mini" id="nowInfo" style="margin-top:8px;color:#475569">No token is being served.</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:4px 0">Queue</h3>
      <input id="q" class="input" placeholder="Search name / phone / PID / token"/>
    </div>
    <table>
      <thead><tr><th>Token</th><th>Patient</th><th>PID/Phone</th><th>Source</th><th>Status</th><th></th></tr></thead>
      <tbody id="tbl"></tbody>
    </table>
    <div class="mini" id="count">0</div>
  </div>

</div>

<script type="module">
  const db = await import("../scripts/db.js");
  const { tokensDB, bookingsDB, getClinicProfile, todayISO } = db;
  const $ = s => document.querySelector(s);
  const dPick=$('#dPick'); dPick.value=todayISO();

  function note(text, cls=''){ const m=$('#msg'); m.className='mini '+cls; m.textContent=text; m.style.display=text?'block':'none'; }
  function speak(text){ try{ const u=new SpeechSynthesisUtterance(text); speechSynthesis.cancel(); speechSynthesis.speak(u);}catch{} }
  $('#refresh').onclick=renderAll; $('#q').addEventListener('input', renderList);

  const key = ()=> 'tokens:now:'+dPick.value;
  const saveNow=t=>localStorage.setItem(key(),JSON.stringify(t||null));
  const loadNow=()=>{ try{return JSON.parse(localStorage.getItem(key())||'null');}catch{return null} };

  document.getElementById('callNext').onclick = async ()=>{
    try{
      const r = await tokensDB.find({selector:{Type:'Token',Date:dPick.value,Status:'Queued'},limit:10000});
      const q = (r.docs||[]).sort((a,b)=>(a.CreatedAt||'').localeCompare(b.CreatedAt||''));
      const nxt = q[0]; if(!nxt){ note('No queued tokens','err'); return; }
      const doc = await tokensDB.get(nxt._id); doc.Status='CALLED'; await tokensDB.put(doc);
      saveNow(doc); renderAll(); speak(`Token ${doc.Token}, please proceed`);
      try{ const br=await bookingsDB.find({selector:{Type:'Booking',Date:doc.Date,Token:doc.Token},limit:1}); if(br.docs?.[0]){ const bx=br.docs[0]; bx.Status='Called'; await bookingsDB.put(bx);} }catch{}
    }catch(e){ console.error(e); note('Failed to call next','err'); }
  };
  document.getElementById('recall').onclick = ()=>{ const n=loadNow(); if(n){ speak(`Token ${n.Token}, please proceed`); note(`Recalled ${n.Token}`);} };
  document.getElementById('markDone').onclick = async ()=>{ const n=loadNow(); if(!n) return; try{ const d=await tokensDB.get(n._id); d.Status='DONE'; await tokensDB.put(d);}catch{} try{const br=await bookingsDB.find({selector:{Type:'Booking',Date:n.Date,Token:n.Token},limit:1}); if(br.docs?.[0]){const bx=br.docs[0]; bx.Status='Completed'; await bookingsDB.put(bx);} }catch{} saveNow(null); renderAll(); note(`${n.Token} → Completed`); };
  document.getElementById('markSkip').onclick = async ()=>{ const n=loadNow(); if(!n) return; try{ const d=await tokensDB.get(n._id); d.Status='SKIPPED'; await tokensDB.put(d);}catch{} saveNow(null); renderAll(); };
  document.getElementById('clearNow').onclick = ()=>{ saveNow(null); renderAll(); };

  function row(tok){
    const tr=document.createElement('tr'); const st=tok.Status||'Queued';
    tr.innerHTML=`
      <td><strong>${tok.Token}</strong></td>
      <td>${tok.PatientName||''}</td>
      <td>${tok.PID||''}<div class="mini">${tok.Phone||''}</div></td>
      <td><span class="badge">${tok.Source||'WALKIN'}</span></td>
      <td>${st}</td>
      <td style="white-space:nowrap">
        ${st==='Queued'?`<button class="btn" data-act="call" data-id="${tok._id}">Call</button>`:''}
        ${tok.Phone?`<button class="btn-wa" data-act="wa" data-id="${tok._id}">WhatsApp</button>`:''}
        ${st!=='DONE'?`<button class="btn-warn" data-act="skip" data-id="${tok._id}">Skip</button>`:''}
        ${st!=='DONE'?`<button class="btn" data-act="done" data-id="${tok._id}">Done</button>`:''}
      </td>`;
    return tr;
  }

  async function renderList(){
    try{
      const qtxt = ($('#q').value||'').toLowerCase();
      const r = await tokensDB.find({ selector:{ Type:'Token', Date:dPick.value }, limit:10000 });
      const docs = (r.docs||[]).sort((a,b)=>{
        const ord=s=>s==='CALLED'?0:s==='Queued'?1:s==='SKIPPED'?2:9;
        const d1=ord(a.Status||'Queued')-ord(b.Status||'Queued'); if(d1) return d1;
        return (a.CreatedAt||'').localeCompare(b.CreatedAt||'');
      }).filter(t => !qtxt || `${t.Token} ${t.PatientName||''} ${t.PID||''} ${t.Phone||''}`.toLowerCase().includes(qtxt));

      const tb=$('#tbl'); tb.innerHTML=''; docs.forEach(d=>tb.appendChild(row(d)));
      $('#count').textContent = `${docs.length} tokens`;

      tb.querySelectorAll('[data-act="call"]').forEach(b=> b.onclick = async ()=>{ const t=await tokensDB.get(b.dataset.id); t.Status='CALLED'; await tokensDB.put(t); saveNow(t); renderAll(); speak(`Token ${t.Token}, please proceed`); });
      tb.querySelectorAll('[data-act="skip"]').forEach(b=> b.onclick = async ()=>{ const t=await tokensDB.get(b.dataset.id); t.Status='SKIPPED'; await tokensDB.put(t); renderAll(); });
      tb.querySelectorAll('[data-act="done"]').forEach(b=> b.onclick = async ()=>{ const t=await tokensDB.get(b.dataset.id); t.Status='DONE'; await tokensDB.put(t); try{const br=await bookingsDB.find({selector:{Type:'Booking',Date:t.Date,Token:t.Token},limit:1}); if(br.docs?.[0]){ const bx=br.docs[0]; bx.Status='Completed'; await bookingsDB.put(bx);} }catch{} renderAll(); });
      tb.querySelectorAll('[data-act="wa"]').forEach(b=> b.onclick = async ()=>{ const t=await tokensDB.get(b.dataset.id); const c=await getClinicProfile(); const text=`Namaste ${t.PatientName||'Parent'}, your token at ${c.Name} is *${t.Token}* (date ${t.Date}). Please be ready when called.`; const to=(t.Phone||'').replace(/[^\d]/g,''); if(to) window.open(`https://wa.me/91${to}?text=${encodeURIComponent(text)}`,'_blank'); });
    }catch(e){ console.error('renderList error', e); note('Failed to load queue','err'); }
  }

  function renderNow(){
    const n=loadNow();
    $('#nowToken').textContent = n? n.Token : '—';
    $('#nowInfo').textContent  = n? (`${n.PatientName||''}  ${n.PID||''}  ${n.Phone||''}`.trim() || '—') : 'No token is being served.';
  }

  async function renderAll(){ renderNow(); await renderList(); }

  try{ tokensDB.changes({since:'now',live:true}).on('change',renderAll); }catch(e){ console.warn(e); }
  renderAll();
</script>
</body>
</html>
