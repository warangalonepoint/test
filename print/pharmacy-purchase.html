<!doctype html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pharmacy Purchase · Print</title>
<link rel="stylesheet" href="/styles/styles.css"/>
<style>
@page{size:A5;margin:8mm}
.small{font-size:12px}
.footer{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px;color:#64748b}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
<script type="module">
import { db } from '/scripts/db.js';
import { loadInvoice } from '/scripts/rx.js';

function getId(){ return Number(new URL(location.href).searchParams.get('id')||0); }

async function clinicHeader(){
  const box=document.getElementById('clinicHeader'); if(!box) return;
  const get=async k=>(await db.settings.get(k))?.value||'';
  const name=await get('clinicName')||'Clinic';
  const doc =await get('doctorName')||'';
  const addr=await get('address')||'';
  const gst =await get('gstin')||'';
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px">
      <div><div style="font-weight:800;font-size:18px">${name}</div><div class="small">${doc}</div><div class="small">${addr}</div></div>
      <div class="small"><b>GSTIN:</b> ${gst||'—'}</div>
    </div>`;
}

async function upiQR(amount){
  const box=document.getElementById('upi'); if(!box) return;
  const upiId=(await db.settings.get('upiId'))?.value||'';
  if(!upiId) return;
  const uri=`upi://pay?pa=${encodeURIComponent(upiId)}&cu=INR&am=${encodeURIComponent((+amount||0).toFixed(2))}`;
  if(navigator.onLine){
    const src=`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(uri)}`;
    box.innerHTML=`<div style="display:flex;align-items:center;gap:8px"><img width="120" height="120" src="${src}" alt="UPI QR"/><div class="small">UPI: <b>${upiId}</b></div></div>`;
  }else{
    box.textContent=`UPI: ${upiId}`;
  }
}

window.addEventListener('DOMContentLoaded', async ()=>{
  await clinicHeader();
  const { inv, items } = await loadInvoice(getId());
  document.getElementById('head').textContent = `PURCHASE  •  #${inv?.number||''}  •  ${inv?.date||''}`;
  document.getElementById('body').innerHTML = (items||[]).map(i=>`
    <tr class="small">
      <td>${i.sku}</td><td>${i.name||''}</td><td>${i.pack||''}</td><td>${i.batch||''}</td><td>${i.expiry||''}</td>
      <td>${i.hsn||''}</td><td>${i.qty}</td><td>${(+i.mrp).toFixed(2)}</td><td>${(+i.rate).toFixed(2)}</td>
      <td>${i.discount||0}%</td><td>${i.taxRate||0}%</td><td>${(+i.amount).toFixed(2)}</td>
    </tr>
  `).join('');
  document.getElementById('totals').innerHTML =
    `<b>Taxable:</b> ₹${(+inv.total).toFixed(2)} • <b>SGST+CGST:</b> ₹${(+inv.tax/2).toFixed(2)} + ₹${(+inv.tax/2).toFixed(2)} • <b>Total:</b> ₹${(+inv.grand).toFixed(2)}`;
  await upiQR(inv?.grand||0);
  setTimeout(()=>window.print(),300);
});
</script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="clinicHeader" style="margin-bottom:6px"></div>
    <h3 id="head"></h3>
    <table class="table">
      <thead class="small"><tr>
        <th>SKU</th><th>Name</th><th>Pack</th><th>Batch</th><th>Exp</th><th>HSN</th>
        <th>Qty</th><th>MRP</th><th>Rate</th><th>Disc%</th><th>GST%</th><th>Amt</th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="totals" style="margin-top:6px"></div>
    <div id="upi" style="margin-top:8px"></div>
  </div>
</div>
<div class="footer">Thank you for visiting • Authorized Signatory</div>
</body></html>
